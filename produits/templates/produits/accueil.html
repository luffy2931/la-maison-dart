{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La Maison d'Art</title>
    <link rel="stylesheet" href="{% static 'produits/style.css' %}">
</head>
<body>
   {% include 'produits/header.html' %}
    <div class="conteneur-produits">
        {% for produit in produits %}
            <a href="{% url 'detail_produit' produit.id %}" class="carte-produit">
    <h2>{{ produit.nom }}</h2>
                <p class="prix">{{ produit.prix }} DZD</p>
                {% if produit.image %}
                    <img src="{{ produit.image.url }}">
                {% endif %}
                {% if produit.stock <= 0 %}
    <span class="badge-vendu">Vendu</span>
{% endif %}
            </a>
{% empty %}
            <p>Aucun produit pour le moment.</p>
        {% endfor %}
    </div>
</body>
</html>
